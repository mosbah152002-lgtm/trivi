<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تريفي">
<title>تريفي للعطور</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>html{-webkit-text-size-adjust:100%;background:#0A0A0B}:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px)}body{margin:0;min-height:100vh}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: top bar + section tabs, then one working column; dashboard uses a 2-column split that stacks on phones. */
:root{
  --bg:#0A0A0B;--surface:#141315;--surface2:#1D1B1A;--ink:#F4EFE4;--muted:#A39B8B;--line:#2B2823;
  --primary:#D4AF5A;--on-primary:#17120A;--primary-soft:#2B2312;--gold-dim:#8A7036;
  --accent:#EBD9A6;--accent-soft:#2A2314;
  --good:#78D3A0;--good-soft:#142A1F;--warn:#F2A65A;--warn-soft:#35230F;--bad:#FF8F80;--bad-soft:#3B1B18;--on-bad:#2B0A07;
  --shadow:0 1px 0 rgb(255 255 255 / .03) inset,0 10px 30px rgb(0 0 0 / .5);
  --nav-h:0px;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;
  --f-brand:"Reem Kufi","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark; /* deliberate single look: black and gold */
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit}
.shell{max-width:1120px;margin:0 auto;padding-block:20px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid;border-image:linear-gradient(to left,var(--primary),transparent) 1}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:none}
.b-body{fill:var(--primary)}.b-cap{fill:var(--accent)}.b-neck{fill:var(--accent)}.b-line{stroke:var(--on-primary);stroke-width:2;fill:none;opacity:.6}
.wordmark{display:block;font-family:var(--f-brand);font-size:30px;font-weight:700;line-height:1.1;color:var(--primary)}
.brand small{display:block;color:var(--muted);font-size:13px}
.today{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs .short{display:none}
.tabs button[aria-current="page"]{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:16px;margin:0 0 12px;font-weight:600;text-wrap:balance}
.vact{display:flex;gap:8px;flex-wrap:wrap}

.btn{font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;min-height:38px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{background:var(--primary);filter:brightness(1.1)}
.btn.sm{padding:3px 10px;min-height:30px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--primary)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.danger{color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:var(--on-bad);border-color:var(--bad)}
.btn.icon{min-width:38px;padding:6px 10px}

.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label{font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.phead h2{margin:0}
.row-end{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.line{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.2fr) auto;gap:10px;align-items:end;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .hint{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:-4px}
.line .hint.bad{color:var(--bad);font-weight:600}
.lt{display:block;min-height:38px;padding:7px 0;font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:680px){.line{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.line .grow{grid-column:1/-1}.line .btn.icon{justify-self:start}}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px;align-items:end}
.tot{display:flex;flex-direction:column;gap:2px}
.tot .k{font-size:13px;color:var(--muted)}
.tot .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.tot.big .v{font-size:22px;color:var(--primary)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-align:start;padding:10px 12px;background:var(--surface2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
td.act{white-space:nowrap;text-align:end}
tr.detail td{background:var(--surface2);padding:12px 16px}
.sub{display:block;color:var(--muted);font-size:12.5px}
.bdg{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.bdg.good{background:var(--good-soft);color:var(--good)}.bdg.warn{background:var(--warn-soft);color:var(--warn)}.bdg.bad{background:var(--bad-soft);color:var(--bad)}
.sum{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13.5px;margin:0 0 10px}
.sum b{color:var(--ink);font-variant-numeric:tabular-nums}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .fld{flex:1 1 200px;max-width:320px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{color:var(--muted);font-size:13px}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hl{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.kpi.hl .k,.kpi.hl .s{color:inherit;opacity:.85}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card+.card{margin-top:16px}
.chart{display:block;width:100%;height:auto;direction:ltr}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .bar{fill:var(--gold-dim)}.chart .bar.now{fill:var(--primary)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .nm{min-width:0}
.list .vl{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.meter{height:6px;border-radius:3px;background:var(--surface2);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h2{color:var(--ink)}
.notice{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.foot{margin-top:28px;color:var(--muted);font-size:12.5px}
textarea.copy{min-height:150px;font-family:var(--f-body);line-height:1.7}

#toast{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + var(--nav-h,0px) + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:100%}
.toast.bad{background:var(--bad);color:var(--on-bad)}
@media (max-width:680px){
  :root{--nav-h:60px}
  .shell{padding-block:14px calc(88px + env(safe-area-inset-bottom,0px))}
  .wordmark{font-size:26px}
  .today{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;gap:0;background:var(--surface);border-bottom:0;border-top:1px solid var(--line);
    padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
  .tabs button{flex:1 1 0;min-width:0;padding:11px 2px 10px;font-size:12px;border-bottom:0;border-top:3px solid transparent}
  .tabs button[aria-current="page"]{border-top-color:var(--primary);border-bottom-color:transparent}
  .tabs .full{display:none}.tabs .short{display:inline}
  input,select,textarea{font-size:16px}
  .btn{min-height:42px}.btn.sm{min-height:38px}.chip{min-height:36px}
  .vact{width:100%}.vact .btn{flex:1 1 auto}
  .toolbar .fld{flex:1 1 140px;max-width:none}
  .kpis,.grid,.totals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:12px}.kpi .v{font-size:19px}
  table.stack>thead{display:none}
  table.stack,table.stack>tbody{display:block}
  table.stack>tbody>tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;padding:12px 14px;border-top:1px solid var(--line)}
  table.stack>tbody>tr:first-child{border-top:0}
  table.stack>tbody>tr>td{display:block;border:0;padding:0;min-width:0;background:none}
  table.stack>tbody>tr>td[data-label]::before{content:attr(data-label);display:block;font-size:12px;color:var(--muted)}
  table.stack>tbody>tr>td.full{grid-column:1/-1}
  table.stack>tbody>tr>td.n{text-align:start;white-space:normal}
  table.stack>tbody>tr>td.act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;text-align:start}
  table.stack>tbody>tr.detail{display:block;background:var(--surface2)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
        <rect x="14" y="3" width="12" height="6" rx="1.5" class="b-cap"/>
        <rect x="17" y="9" width="6" height="4" class="b-neck"/>
        <path d="M10 17a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v15a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4z" class="b-body"/>
        <path d="M15 23h10" class="b-line"/>
      </svg>
      <div><span class="wordmark">تريفي</span><small>للعطور · المبيعات والمشتريات والمخزون</small></div>
    </div>
    <div class="today" id="todayLbl"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="الأقسام">
    <button type="button" data-act="go" data-v="home"><span class="full">الرئيسية</span><span class="short">الرئيسية</span></button>
    <button type="button" data-act="go" data-v="sales"><span class="full">المبيعات</span><span class="short">المبيعات</span></button>
    <button type="button" data-act="go" data-v="purchases"><span class="full">المشتريات</span><span class="short">المشتريات</span></button>
    <button type="button" data-act="go" data-v="products"><span class="full">الأصناف والمخزون</span><span class="short">الأصناف</span></button>
    <button type="button" data-act="go" data-v="parties"><span class="full">العملاء والموردين</span><span class="short">العملاء</span></button>
    <button type="button" data-act="go" data-v="reports"><span class="full">التقارير</span><span class="short">التقارير</span></button>
  </nav>
  <div id="notice"></div>
  <main id="main"></main>
  <div class="foot" id="foot"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const r2=n=>Math.round(num(n)*100)/100;
const money=n=>nf.format(r2(n));
const M=n=>money(n)+' ج.م';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const dm=s=>{if(!s)return'';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const byId=(a,id)=>a.find(x=>x.id===id);
const cmpAr=(a,b)=>String(a).localeCompare(String(b),'ar');
const CATS=['رجالي','نسائي','للجنسين','زيوت عطرية','بخور ومعمول','أخرى'];
const CONCS=['أو دو بارفان','أو دو تواليت','بارفان','كولونيا','زيت عطري','بخور','أخرى'];
const COLS=['products','parties','sales','purchases','payments'];
const VIEWS=['home','sales','purchases','products','parties','reports'];
const TITLES={home:'الرئيسية',sales:'فواتير المبيعات',purchases:'فواتير المشتريات',products:'الأصناف والمخزون',parties:'العملاء والموردين',reports:'التقارير'};

const S={products:[],parties:[],sales:[],purchases:[],payments:[]};
const loaded={};
let be=null,mode='loading',dbError=false,dlCap=null,view='home',draft=null,panel=null;
const F={q:'',cat:'',low:false,ptype:'customer',open:{},irange:'month',range:'month',from:'',to:''};

/* ---------- storage ---------- */
function allLoaded(){return COLS.every(c=>loaded[c])}
const LS={
  get(c){try{return JSON.parse(localStorage.getItem('trivi:'+c)||'[]')}catch(e){return[]}},
  set(c,a){try{localStorage.setItem('trivi:'+c,JSON.stringify(a))}catch(e){}}
};
async function initBackend(){
  renderNotice();
  let db=null;
  db=null;
  if(db){
    mode='cloud';
    be={
      save:(c,o)=>{const d=Object.assign({},o);delete d.id;return db.collection(c).doc(o.id).set(d)},
      del:(c,id)=>db.collection(c).doc(id).delete()
    };
    COLS.forEach(c=>{
      db.collection(c).onSnapshot(snap=>{
        S[c]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
        loaded[c]=true;onData();
      },err=>{dbError=true;loaded[c]=true;onData()});
    });
    setTimeout(()=>{if(!allLoaded()){dbError=true;renderNotice()}},10000);
  }else{
    mode='local';
    COLS.forEach(c=>{S[c]=LS.get(c);loaded[c]=true});
    be={
      save:async(c,o)=>{S[c]=S[c].filter(x=>x.id!==o.id).concat([o]);LS.set(c,S[c]);onData()},
      del:async(c,id)=>{S[c]=S[c].filter(x=>x.id!==id);LS.set(c,S[c]);onData()}
    };
    onData();
  }
}
async function safe(fn){try{await fn();return true}catch(e){toast('تعذر الحفظ. تأكد من صلاحية التعديل وحاول مرة أخرى.','bad');return false}}

/* ---------- derived numbers ---------- */
const prodName=p=>p?(p.name+(p.size?' '+p.size:'')):'—';
function calcStock(exS,exP){
  const m={};S.products.forEach(p=>{m[p.id]=num(p.opening)});
  S.purchases.forEach(v=>{if(v.id===exP)return;(v.lines||[]).forEach(l=>{if(l.pid in m)m[l.pid]+=num(l.qty)})});
  S.sales.forEach(v=>{if(v.id===exS)return;(v.lines||[]).forEach(l=>{if(l.pid in m)m[l.pid]-=num(l.qty)})});
  return m;
}
const unit=(l,k)=>num(k==='sales'?l.price:l.cost);
const invSub=(v,k)=>(v.lines||[]).reduce((a,l)=>a+num(l.qty)*unit(l,k),0);
const invTotal=(v,k)=>Math.max(0,invSub(v,k)-num(v.discount));
const invCogs=v=>(v.lines||[]).reduce((a,l)=>a+num(l.qty)*num(l.cost),0);
const invRem=(v,k)=>r2(invTotal(v,k)-num(v.paid));
function calcBalances(){
  const b={};S.parties.forEach(p=>{b[p.id]=num(p.opening)});
  S.sales.forEach(s=>{if(s.partyId&&s.partyId in b)b[s.partyId]+=invTotal(s,'sales')-num(s.paid)});
  S.purchases.forEach(s=>{if(s.partyId&&s.partyId in b)b[s.partyId]+=invTotal(s,'purchases')-num(s.paid)});
  S.payments.forEach(p=>{if(p.partyId in b)b[p.partyId]-=num(p.amount)});
  return b;
}
function nextNo(k){return Math.max(1000,...S[k].map(x=>num(x.no)))+1}
function rangeBounds(r,from,to){
  const t=today();
  if(r==='today')return[t,t];
  if(r==='week'){const d=new Date(t+'T12:00:00');return[addDays(t,-((d.getDay()+1)%7)),t]}
  if(r==='month')return[t.slice(0,8)+'01',t];
  if(r==='30')return[addDays(t,-29),t];
  if(r==='custom')return[from||'0000-00-00',to||'9999-99-99'];
  return['0000-00-00','9999-99-99'];
}
const RANGES=[['today','اليوم'],['week','هذا الأسبوع'],['month','هذا الشهر'],['30','آخر 30 يوم'],['all','كل الفترة']];

/* ---------- ui helpers ---------- */
function toast(msg,kind){
  const el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.textContent=msg;
  $('#toast').appendChild(el);setTimeout(()=>el.remove(),3400);
}
function closePanel(){panel=null;draft=null;const f=$('#fh');if(f)f.innerHTML=''}
function openHost(html,focusSel){
  const f=$('#fh');f.innerHTML=html;
  f.scrollIntoView({block:'start'});
  if(focusSel){const e=$(focusSel,f);if(e)e.focus({preventScroll:true})}
}
function renderNotice(){
  const n=$('#notice');let h='';
  if(dbError)h+='<div class="notice"><span>تعذر الوصول إلى البيانات المحفوظة حالياً. قد تكون البيانات المعروضة قديمة.</span></div>';

/* ---------- backup ---------- */
function lastBackup(){try{return num(localStorage.getItem('trivi:lastBackup'))}catch(e){return 0}}
async function doBackup(){
  const data=JSON.stringify({app:'trivi',version:1,date:new Date().toISOString(),data:S});
  try{await dlCap.save({filename:'trivi-backup-'+today()+'.json',data:data});try{localStorage.setItem('trivi:lastBackup',String(Date.now()))}catch(e){}toast('تم تجهيز ملف النسخة الاحتياطية');renderNotice()}
  catch(e){toast('تعذر حفظ الملف','bad')}
}
let pendingRestore=null;
function readRestore(file){
  const fr=new FileReader();
  fr.onerror=()=>toast('تعذر قراءة الملف','bad');
  fr.onload=()=>{
    let o=null;try{o=JSON.parse(String(fr.result))}catch(e){}
    if(!o||o.app!=='trivi'||!o.data||COLS.some(c=>!Array.isArray(o.data[c]))){toast('هذا ليس ملف نسخة احتياطية من تريفي','bad');return}
    pendingRestore=o.data;
    panel={type:'restore'};
    openHost('<div class="panel"><div class="phead"><h2>استرجاع نسخة احتياطية</h2><button type="button" class="btn sm ghost" data-act="close">إغلاق</button></div>'+
      '<p>النسخة تحتوي على '+o.data.products.length+' صنف و '+o.data.sales.length+' فاتورة بيع و '+o.data.purchases.length+' فاتورة شراء و '+o.data.parties.length+' عميل ومورد.</p>'+
      '<p class="sub">سيتم استبدال كل البيانات الحالية على هذا الجهاز بمحتوى هذه النسخة.</p>'+
      '<div class="row-end"><button type="button" class="btn danger" data-act="confirmrestore">استبدال البيانات الحالية</button><button type="button" class="btn ghost" data-act="close">إلغاء</button></div></div>');
  };
  fr.readAsText(file);
}
function confirmRestore(){
  if(!pendingRestore)return;
  COLS.forEach(c=>{S[c]=pendingRestore[c];LS.set(c,S[c])});
  pendingRestore=null;closePanel();onData();toast('تم استرجاع البيانات');
}
function backupCard(){
  const lb=lastBackup();
  return'<div class="card" style="margin-top:16px"><h2>النسخة الاحتياطية</h2><p class="sub" style="margin:0 0 12px">البيانات محفوظة على هذا الجهاز فقط. خذ نسخة بشكل دوري واحتفظ بالملف في مكان آخر. '+(lb?'آخر نسخة: '+dm(ymd(new Date(lb)))+'.':'لم تأخذ نسخة بعد.')+'</p>'+
    '<div class="row-end" style="margin-top:0"><button type="button" class="btn primary" data-act="backup">حفظ نسخة احتياطية</button><button type="button" class="btn" data-act="restore">استرجاع من ملف</button></div>'+

/* ---------- dashboard ---------- */
function niceMax(m){const raw=m/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const c=[1,2,2.5,5,10].map(x=>x*p).find(x=>x>=raw-1e-9);return c*4}
function chartSales(){
  const t=today(),days=[];for(let i=13;i>=0;i--)days.push(addDays(t,-i));
  const vals=days.map(d=>S.sales.filter(s=>s.date===d).reduce((a,s)=>a+invTotal(s,'sales'),0));
  const mx=niceMax(Math.max.apply(null,vals.concat([400])));
  const W=640,H=230,L=60,R=10,T=14,B=30,iw=W-L-R,ih=H-T-B,bw=iw/days.length;
  let g='';
  for(let k=0;k<=4;k++){const y=T+ih-ih*k/4;g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+money(mx*k/4)+'</text>'}
  vals.forEach((v,i)=>{
    const h=ih*v/mx,x=L+i*bw+bw*0.18,w=bw*0.64,cl=days[i]===t?'bar now':'bar';
    g+='<rect class="'+cl+'" x="'+x.toFixed(1)+'" y="'+(T+ih-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(v>0?Math.max(h,2):0).toFixed(1)+'" rx="3"><title>'+dm(days[i])+': '+M(v)+'</title></rect>';
    g+='<text class="ax" x="'+(L+i*bw+bw/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+days[i].slice(8)+'</text>';
  });
  return'<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="مبيعات آخر 14 يوماً بالجنيه">'+g+'</svg>';
}

    '<div class="card"><h2>الأكثر مبيعاً هذا الشهر</h2>'+(topL.length?'<ul class="list">'+topL.map(x=>'<li style="display:block"><div style="display:flex;justify-content:space-between;gap:12px"><span class="nm">'+esc(prodName(x.p))+'</span><span class="vl">'+money(x.q)+' قطعة</span></div><div class="meter"><i style="width:'+(x.q/topMax*100).toFixed(0)+'%"></i></div></li>').join('')+'</ul>':'<div class="empty">لا توجد مبيعات هذا الشهر بعد.</div>')+'</div>'+

function updLine(i){
  const l=draft.lines[i];if(!l)return;
  const isS=draft.kind==='sales',o=$('#l'+i+'t'),h=$('#l'+i+'h');
  if(o)o.textContent=money(num(l.qty)*num(l.price));
  if(!h)return;
  const p=byId(S.products,l.pid);
  if(!p){h.textContent='';h.className='hint';return}
  const sm=calcStock(isS?draft.id:null,isS?null:draft.id);
  let need=0;draft.lines.forEach(x=>{if(x.pid===l.pid)need+=num(x.qty)});
  if(isS&&need>sm[p.id]+1e-9){h.textContent='الكمية المطلوبة أكبر من المتاح ('+money(sm[p.id])+')';h.className='hint bad'}
  else{h.textContent=(isS?'التكلفة '+money(p.cost)+' · هامش '+(num(l.price)>0?money((num(l.price)-num(p.cost))/num(l.price)*100)+'%':'—'):'آخر تكلفة '+money(p.cost))+' · المتاح '+money(sm[p.id]);h.className='hint'}
}
function updTotals(){
  if(!draft)return;
  const sub=draft.lines.reduce((a,l)=>a+num(l.qty)*num(l.price),0),total=Math.max(0,sub-num(draft.discount));
  if(!draft.paidTouched){draft.paid=r2(total);const p=$('#fPaid');if(p)p.value=draft.paid?draft.paid:''}
  $('#tSub').textContent=M(sub);$('#tTotal').textContent=M(total);$('#tRem').textContent=M(total-num(draft.paid));
}
function relines(){$('#lines').innerHTML=linesHtml();draft.lines.forEach((_,i)=>updLine(i));updTotals()}
function scanAdd(raw){
  const code=String(raw||'').trim();
  if(!code||!draft)return;
  const p=S.products.find(x=>x.barcode===code);
  if(!p){toast('لا يوجد صنف بهذا الباركود','bad');return}
  const isS=draft.kind==='sales',ex=draft.lines.find(l=>l.pid===p.id);
  if(ex)ex.qty=num(ex.qty)+1;
  else{
    const nl={pid:p.id,qty:1,price:isS?num(p.price):num(p.cost),cost0:num(p.cost)},blank=draft.lines.find(l=>!l.pid);
    if(blank)Object.assign(blank,nl);else draft.lines.push(nl);
  }
  relines();
  const s=$('#fScan');if(s){s.value='';s.focus()}
  toast('أُضيف: '+prodName(p));
}
async function saveInvoice(){
  const k=draft.kind,isS=k==='sales';
  if(!draft.date){toast('اختر تاريخ الفاتورة','bad');return}
  const lines=draft.lines.filter(l=>l.pid);
  if(!lines.length){toast('اختر صنفاً واحداً على الأقل','bad');return}
  if(lines.some(l=>!(num(l.qty)>0))){toast('أدخل كمية أكبر من صفر في كل سطر','bad');return}
  if(isS){
    const sm=calcStock(draft.id,null),need={};
    lines.forEach(l=>{need[l.pid]=(need[l.pid]||0)+num(l.qty)});
    for(const pid in need){if(need[pid]>sm[pid]+1e-9){toast('الكمية المطلوبة من «'+prodName(byId(S.products,pid))+'» أكبر من المتاح ('+money(sm[pid])+')','bad');return}}
  }
  const sub=lines.reduce((a,l)=>a+num(l.qty)*num(l.price),0),total=Math.max(0,sub-num(draft.discount)),paid=num(draft.paid);
  if(paid>total+0.005){toast('المبلغ المدفوع أكبر من إجمالي الفاتورة','bad');return}
  if(!draft.partyId&&r2(total-paid)>0){toast('اختر '+(isS?'العميل':'المورد')+' لتسجيل مبلغ آجل','bad');return}
  const party=byId(S.parties,draft.partyId),old=draft.id?byId(S[k],draft.id):null;
  const obj=Object.assign({},old||{},{
    id:draft.id||uid(),no:draft.no,date:draft.date,partyId:draft.partyId||'',partyName:party?party.name:'',
    lines:lines.map(l=>{const p=byId(S.products,l.pid);
      if(isS)return{pid:l.pid,name:prodName(p),qty:num(l.qty),price:num(l.price),cost:(old&&(old.lines||[]).some(x=>x.pid===l.pid))?num(l.cost0):num(p.cost)};
      return{pid:l.pid,name:prodName(p),qty:num(l.qty),cost:num(l.price)}}),
    discount:num(draft.discount),paid:paid,note:draft.note.trim()
  });
  if(!(await safe(()=>be.save(k,obj))))return;
  if(!isS){for(const l of obj.lines){const p=byId(S.products,l.pid);if(p&&num(p.cost)!==l.cost){await safe(()=>be.save('products',Object.assign({},p,{cost:l.cost})))}}}
  closePanel();toast('تم حفظ الفاتورة رقم '+obj.no);
}
function invText(v,k){
  const isS=k==='sales';
  let t='تريفي للعطور\nفاتورة '+(isS?'بيع':'شراء')+' رقم '+v.no+' — '+dm(v.date)+'\n'+(isS?'العميل: ':'المورد: ')+(v.partyName||(isS?'عميل نقدي':'مورد غير مسجل'))+'\n------------------\n';
  (v.lines||[]).forEach(l=>{t+=l.name+' × '+money(l.qty)+' = '+money(num(l.qty)*unit(l,k))+'\n'});
  t+='------------------\n';
  if(num(v.discount))t+='الخصم: '+M(v.discount)+'\n';
  t+='الإجمالي: '+M(invTotal(v,k))+'\nالمدفوع: '+M(v.paid)+'\nالمتبقي: '+M(invRem(v,k));
  return t;
}
function copyText(text){
  const fallback=()=>{panel={type:'copy'};openHost('<div class="panel"><div class="phead"><h2>انسخ نص الفاتورة</h2><button type="button" class="btn sm ghost" data-act="close">إغلاق</button></div><textarea class="copy" id="copyBox" readonly>'+esc(text)+'</textarea></div>','#copyBox');const b=$('#copyBox');if(b)b.select()};
  try{navigator.clipboard.writeText(text).then(()=>toast('تم نسخ الفاتورة'),fallback)}catch(e){fallback()}
}

}

/* ---------- reports ---------- */
function reportData(){
  const[f,t]=rangeBounds(F.range,F.from,F.to);
  const sales=S.sales.filter(s=>(s.date||'')>=f&&(s.date||'')<=t),purs=S.purchases.filter(s=>(s.date||'')>=f&&(s.date||'')<=t);
  const prod={},cust={};
  let rev=0,cogs=0;
  sales.forEach(s=>{
    const sub=invSub(s,'sales'),tot=invTotal(s,'sales');rev+=tot;cogs+=invCogs(s);
    (s.lines||[]).forEach(l=>{
      const lt=num(l.qty)*num(l.price),share=sub>0?lt/sub*tot:0,k=l.pid;
      const o=prod[k]||(prod[k]={name:l.name,qty:0,rev:0,profit:0});
      o.qty+=num(l.qty);o.rev+=share;o.profit+=share-num(l.qty)*num(l.cost);
    });
    const ck=s.partyId||'_',c=cust[ck]||(cust[ck]={name:s.partyName||'عملاء نقديون',n:0,total:0,rem:0});
    c.n++;c.total+=tot;c.rem+=invRem(s,'sales');
  });
  return{f,t,sales,purs,rev,cogs,profit:rev-cogs,buy:purs.reduce((a,s)=>a+invTotal(s,'purchases'),0),
    unpaid:sales.reduce((a,s)=>a+Math.max(0,invRem(s,'sales')),0),
    prod:Object.keys(prod).map(k=>prod[k]).sort((a,b)=>b.rev-a.rev),cust:Object.keys(cust).map(k=>cust[k]).sort((a,b)=>b.total-a.total)};
}
function renderReports(){
  const d=reportData();
  const kp='<div class="kpis">'+
    '<div class="kpi hl"><span class="k">إجمالي المبيعات</span><span class="v">'+M(d.rev)+'</span><span class="s">'+d.sales.length+' فاتورة</span></div>'+
    '<div class="kpi"><span class="k">تكلفة البضاعة المباعة</span><span class="v">'+M(d.cogs)+'</span></div>'+
    '<div class="kpi"><span class="k">إجمالي الربح</span><span class="v">'+M(d.profit)+'</span><span class="s">'+(d.rev>0?money(d.profit/d.rev*100)+'% هامش':'—')+'</span></div>'+
    '<div class="kpi"><span class="k">إجمالي المشتريات</span><span class="v">'+M(d.buy)+'</span><span class="s">'+d.purs.length+' فاتورة</span></div>'+
    '<div class="kpi"><span class="k">مبيعات آجلة غير مسددة</span><span class="v">'+M(d.unpaid)+'</span></div></div>';
  if(!d.sales.length&&!d.purs.length)return kp+'<div class="card empty"><h2>لا توجد حركة في هذه الفترة</h2><p>الفترة: '+(d.f==='0000-00-00'?'من البداية':dm(d.f))+' إلى '+(d.t==='9999-99-99'?'الآن':dm(d.t))+'</p></div>';
  const tp=d.prod.length?'<div class="tw"><table><thead><tr><th>الصنف</th><th class="n">الكمية</th><th class="n">المبيعات</th><th class="n">الربح</th></tr></thead><tbody>'+d.prod.map(p=>'<tr><td>'+esc(p.name)+'</td><td class="n">'+money(p.qty)+'</td><td class="n">'+money(p.rev)+'</td><td class="n">'+money(p.profit)+'</td></tr>').join('')+'</tbody></table></div>':'';
  const tc=d.cust.length?'<div class="tw"><table><thead><tr><th>العميل</th><th class="n">الفواتير</th><th class="n">المبيعات</th><th class="n">المتبقي</th></tr></thead><tbody>'+d.cust.map(c=>'<tr><td>'+esc(c.name)+'</td><td class="n">'+c.n+'</td><td class="n">'+money(c.total)+'</td><td class="n">'+money(c.rem)+'</td></tr>').join('')+'</tbody></table></div>':'';
  return kp+'<h2>المبيعات حسب الصنف</h2>'+tp+'<h2 style="margin-top:20px">المبيعات حسب العميل</h2>'+tc;
}
async function exportCsv(k){
  if(!dlCap)return;
  const d=reportData(),isS=k==='sales',list=isS?d.sales:d.purs;
  if(!list.length){toast('لا توجد فواتير في هذه الفترة للتصدير','bad');return}
  const cell=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['رقم الفاتورة','التاريخ',isS?'العميل':'المورد','الصنف','الكمية',isS?'سعر البيع':'سعر الشراء','الإجمالي']];
  list.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(v=>(v.lines||[]).forEach(l=>rows.push([v.no,v.date,v.partyName||'',l.name,l.qty,unit(l,k),num(l.qty)*unit(l,k)])));
  try{await dlCap.save({filename:'trivi-'+(isS?'sales':'purchases')+'-'+today()+'.csv',data:'﻿'+rows.map(r=>r.map(cell).join(',')).join('\r\n')})}
  catch(e){if(!e||e.code!=='declined')toast('تعذر حفظ الملف','bad')}
}
async function deleteDemo(){
  let ok=true;
  for(const c of COLS){for(const x of S[c].filter(y=>y.demo)){if(!(await safe(()=>be.del(c,x.id)))){ok=false;break}}if(!ok)break}
  if(ok)toast('تم حذف البيانات التجريبية');
}

/* ---------- events ---------- */
function arm(b){
  if(b.dataset.armed)return true;
  b.dataset.armed='1';b.dataset.t0=b.textContent;b.textContent='تأكيد الحذف؟';
  setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=b.dataset.t0}},3000);
  return false;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='go')go(b.dataset.v);
  else if(a==='newsale'){go('sales');openInvoice('sales')}
  else if(a==='newpur'){go('purchases');openInvoice('purchases')}
  else if(a==='new'){if(view==='sales'||view==='purchases')openInvoice(view);else if(view==='products')openProduct();else if(view==='parties')openParty()}
  else if(a==='close')closePanel();
  else if(a==='addline'&&draft){draft.lines.push(blankLine());relines()}
  else if(a==='rmline'&&draft){if(draft.lines.length>1){draft.lines.splice(+b.dataset.i,1);relines()}else toast('الفاتورة تحتاج صنفاً واحداً على الأقل','bad')}
  else if(a==='paidfull'&&draft){draft.paidTouched=false;updTotals()}
  else if(a==='saveinv'&&draft)saveInvoice();
  else if(a==='toggle'){F.open[id]=!F.open[id];renderList()}
  else if(a==='copyinv'){const v=byId(S[view],id);if(v)copyText(invText(v,view))}
  else if(a==='editinv'){const v=byId(S[view],id);if(v)openInvoice(view,v)}
  else if(a==='delinv'){if(arm(b)){await safe(()=>be.del(view,id));toast('تم حذف الفاتورة')}}
  else if(a==='editprod')openProduct(id);
  else if(a==='delprod'){
    if(S.sales.concat(S.purchases).some(v=>(v.lines||[]).some(l=>l.pid===id))){toast('الصنف مستخدم في فواتير سابقة ولا يمكن حذفه','bad');return}
    if(arm(b)){await safe(()=>be.del('products',id));toast('تم حذف الصنف')}
  }
  else if(a==='saveprod')saveProduct();
  else if(a==='editparty')openParty(id);
  else if(a==='delparty'){
    if(S.sales.concat(S.purchases).some(v=>v.partyId===id)||S.payments.some(y=>y.partyId===id)){toast('هذه الجهة لها فواتير أو دفعات ولا يمكن حذفها','bad');return}
    if(arm(b)){await safe(()=>be.del('parties',id));toast('تم الحذف')}
  }
  else if(a==='saveparty')saveParty();
  else if(a==='statement')openStatement(id);
  else if(a==='pay')openPayment(id);
  else if(a==='savepay')savePayment();
  else if(a==='chip'){F[b.dataset.k]=b.dataset.val;renderTb();renderList()}
  else if(a==='lowtoggle'){F.low=!F.low;renderTb();renderList()}
  else if(a==='export')exportCsv(b.dataset.k);
  else if(a==='deldemo'){if(arm(b))deleteDemo()}
  else if(a==='backup')doBackup();
  else if(a==='restore'){const f=$('#restoreFile');if(f)f.click()}
  else if(a==='confirmrestore')confirmRestore();
});
function onInput(e){
  const t=e.target;
  if(t.dataset.flt){F[t.dataset.flt]=t.value;renderList();return}
  if(!draft)return;
  if(t.dataset.f){
    const f=t.dataset.f;
    if(f==='date'||f==='partyId'||f==='note')draft[f]=t.value;
    else if(f==='discount'){draft.discount=t.value;updTotals()}
    else if(f==='paid'){draft.paid=t.value;draft.paidTouched=true;updTotals()}
    return;
  }
  if(t.dataset.l){
    const i=+t.dataset.i,l=draft.lines[i];if(!l)return;
    if(t.dataset.l==='pid'){
      if(l.pid===t.value)return;
      l.pid=t.value;const p=byId(S.products,l.pid);
      if(p){l.price=draft.kind==='sales'?num(p.price):num(p.cost);if(!(num(l.qty)>0))l.qty=1;l.cost0=num(p.cost)}
      relines();return;
    }
    l[t.dataset.l]=t.value;
    draft.lines.forEach((_,j)=>updLine(j));updTotals();
  }
}
document.addEventListener('input',onInput);
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='fScan'&&e.key==='Enter'){e.preventDefault();scanAdd(e.target.value)}});
document.addEventListener('change',e=>{if(e.target.id==='restoreFile'){const f=e.target.files&&e.target.files[0];if(f)readRestore(f);e.target.value='';return}if(e.target.tagName==='SELECT')onInput(e)});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v!==view)go(v)});

/* ---------- start ---------- */
(async function init(){
  try{$('#todayLbl').textContent=new Date().toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){}
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
  go(location.hash.slice(1)||'home');
  await initBackend();
  dlCap={save:async({filename,data})=>{const b=new Blob([data],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}};
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(view==='reports')go('reports');
})();
})();
</script>
